plugins {
    id 'dev.architectury.loom-no-remap' version '1.17.493' apply false
    id 'com.gradleup.shadow' version '9.4.3' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.4.21' apply false
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'maven-publish'
    apply plugin: 'org.jetbrains.kotlin.jvm'

    base {
        archivesName = "${rootProject.archives_name}-${project.name}"
    }

    repositories {
        mavenCentral()
    }

    plugins.withId('dev.architectury.loom-no-remap') {
        dependencies {
            minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
            compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlin_version}"
        }
    }
    java {
        withSourcesJar()
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }

    kotlin {
        jvmToolchain(25)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}
